<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title>畫中畫無限縮放編輯器</title>
  <link rel="icon" href="icon/icon.png" type="image/png">
  <!-- 引入 JSZip 與 FileSaver (用於匯出 ZIP 打包檔) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <!-- 引入範本檔與旋轉模組 -->
  <script src="template.js"></script>
  <script src="rotation.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; display: flex; height: 100vh; background: #f0f2f5; overflow: hidden; user-select: none; }

    /* 左側控制面板 */
    .sidebar { width: 380px; background: #fff; box-shadow: 2px 0 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; z-index: 10; }
    .sidebar-header { 
      padding: 14px 20px; 
      border-bottom: 1px solid #eee; 
      background: #fffbe6;
      color: #333333;
      display: flex;
      align-items: center;
    }
    .sidebar-header h2 { margin: 0; font-size: 18px; }
    .sidebar-header p { margin: 5px 0 0 0; font-size: 12px; color: #aaa; }
	
    .header-icon {
      width: 100px;
      height: 100px;
      object-fit: contain;
      flex-shrink: 0;
    }
    
    .layers-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
    
    .layer-card { background: #f8f9fa; border: 2px solid #ddd; border-radius: 8px; padding: 14px; cursor: pointer; transition: all 0.2s; position: relative; }
    .layer-card:hover { border-color: #aaa; }
    .layer-card.active { border-color: #007bff; background: #f0f7ff; box-shadow: 0 4px 12px rgba(0,123,255,0.15); }
    .layer-title { font-weight: bold; margin-bottom: 10px; display: flex; justify-content: space-between; font-size: 14px; color: #333; align-items: center; }
    
    .btn-delete { background: #dc3545; color: white; border: none; padding: 4px 10px; font-size: 11px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
    .btn-delete:hover { background: #bd2130; }

    .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; font-size: 12px; }
    .form-group label { color: #555; font-weight: 500; }
    .form-group input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-family: monospace; }
    .form-group input:focus { border-color: #007bff; outline: none; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    
    /* 檔案上傳排版 */
    .upload-row { display: flex; gap: 6px; align-items: center; }
    .btn-upload { background: #28a745; color: white; padding: 8px 12px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; transition: background 0.2s; white-space: nowrap; }
    .btn-upload:hover { background: #218838; }
    .path-display { flex: 1; padding: 8px; background: #e9ecef; border: 1px dashed #ccc; border-radius: 4px; font-size: 11px; color: #666; font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .btn { 
      padding: 12px 24px; 
      border: none; 
      border-radius: 50px;
      cursor: pointer; 
      font-weight: bold; 
      transition: all 0.3s ease; 
      text-align: center; 
      font-size: 14px; 
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    .btn-add { 
      background: linear-gradient(90deg, #17a2b8, #20c997); 
      margin: 15px 15px 5px 15px; 
    }

    .btn-export { 
      background: linear-gradient(90deg, #007bff, #ff3bd8); 
      margin: 5px 15px 15px 15px; 
    }

    .btn:hover { 
      opacity: 0.95; 
      transform: translateY(-2px); 
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2); 
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
    }   

    /* 右側畫布預覽區 */
    .canvas-area { flex: 1; display: flex; flex-direction: column; position: relative; background: #e9ecef; overflow-y: auto; }
    
    /* 頂部控制列 */
    .toolbar { 
      height: 60px; 
      background: #fff; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      gap: 15px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
      z-index: 5; 
      position: relative;
    }

    .toolbar::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, #b026ff, #007bff, #00f2fe, #38ef7d);
    }
    .mode-btn { padding: 8px 16px; border-radius: 20px; border: 2px solid #ccc; background: #fff; cursor: pointer; font-weight: bold; color: #555; transition: all 0.2s; }
    .mode-btn.is-editing { border-color: #ff3b30; background: #fff0f0; color: #ff3b30; }
    .mode-btn.is-viewing { border-color: #007bff; background: #f0f7ff; color: #007bff; }

    .canvas-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; overflow: hidden; padding: 20px; min-height: 85vh; }
    .canvas-container { 
      width: 600px;
      height: 600px;
      min-width: 300px;
      min-height: 300px;
      background: #fff; 
      box-shadow: 0 15px 40px rgba(0,0,0,0.15); 
      border-radius: 4px; 
      overflow: hidden;
      position: relative; 
      resize: both;
    }
    
    .preview-svg { width: 100%; height: 100%; display: block; background: #fafafa; }
    .preview-svg.mode-view { cursor: grab; }
    .preview-svg.mode-view:active { cursor: grabbing; }
    .preview-svg.mode-edit { cursor: move; }

    .info-overlay { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.85); color: #fff; padding: 8px 14px; border-radius: 20px; font-family: monospace; font-size: 13px; pointer-events: none; }
    .help-overlay { position: absolute; bottom: 15px; right: 15px; background: rgba(0,0,0,0.6); color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 12px; pointer-events: none; }
    
    .notice-info { margin: 0 15px; padding: 10px; background: #eaf2ff; border: 1px solid #b8d5ff; border-radius: 6px; font-size: 11px; color: #004085; }
  </style>
</head>
<body>

  <!-- 左側控制面板 -->
  <div class="sidebar">
    <div class="sidebar-header">
      <img src="icon/icon.png" alt="Logo" class="header-icon">
      <div class="header-text">
        <h2>Web版畫中畫 GUI 編輯器</h2>
        <p>開源程式(免安裝)</p>
      </div>
    </div>
    <div class="layers-container" id="layersContainer"></div>
    
    <div class="notice-info">
      🔗 <b>提示：</b> 本程式採用cdnjs，所有上傳的圖片與檔案不會記錄在任何伺服器。匯出後請謹記解壓全部檔案！
    </div>

    <button class="btn btn-add" onclick="addLayer()">＋ 新增圖片階段 (Stage)</button>
    <button class="btn btn-export" onclick="exportHTML()">💾 匯出 HTML 網頁</button>
  </div>

  <!-- 右側實時預覽區 -->
  <div class="canvas-area">
    <div class="toolbar">
      <button id="btnModeView" class="mode-btn active-view" onclick="setMode('view')">👁️ 移動背景視角</button>
      <button id="btnModeEdit" class="mode-btn" onclick="setMode('edit')">🎯 調整紅框內嵌圖 (縮放/位移)</button>
    </div>

    <div class="canvas-wrapper">
      <div class="canvas-container" id="canvasContainer">
        <div class="info-overlay" id="infoOverlay">目前檢視：Stage 1</div>
        <div class="help-overlay" id="helpText">💡 提示：拖曳以平移背景，滾輪放大縮小背景視角</div>
        <svg class="preview-svg mode-view" id="previewSvg"></svg>
      </div>
    </div>
  </div>

<script>
let layers = [
  { stage: 1, path: "", previewSrc: "", baseSize: 700, x: 0, y: 0, scale: 1, angle: 0, trigger: 10000, file: null }
];

let activeStage = 1;
let interactionMode = 'view';

let viewStates = {
  1: { zoom: 1.0, focusX: 350, focusY: 350 }
};

let isDragging = false;
let isRotating = false;
let startAngleOffset = 0;
let lastMouseX, lastMouseY;
let isEventsBound = false;

function init() {
  renderLayersControl();
  setMode(activeStage > 1 ? 'edit' : 'view');
  setupCanvasEvents();
}

/**
 * 更新模式按鈕的 UI 狀態 (包含 Stage 1 灰顯 / 禁用邏輯)
 */
function updateModeButtonsUI() {
  const btnView = document.getElementById('btnModeView');
  const btnEdit = document.getElementById('btnModeEdit');
  
  // 當前為 Stage 1 時，禁用 Edit 按鈕並灰顯
  if (activeStage === 1) {
    btnEdit.disabled = true;
    btnEdit.style.opacity = '0.4';
    btnEdit.style.cursor = 'not-allowed';
    btnEdit.title = 'Stage 1 為最底層背景，無法進行相對內嵌調整';
  } else {
    btnEdit.disabled = false;
    btnEdit.style.opacity = '1';
    btnEdit.style.cursor = 'pointer';
    btnEdit.title = '';
  }

  // 模式選取高亮樣式
  if (interactionMode === 'view') {
    btnView.classList.add('is-viewing');
    btnEdit.classList.remove('is-editing');
  } else {
    btnView.classList.remove('is-viewing');
    btnEdit.classList.add('is-editing');
  }
}

function setMode(mode) {
  // 保護機制：Stage 1 強制鎖定為 view
  if (activeStage === 1 && mode === 'edit') {
    interactionMode = 'view';
  } else {
    interactionMode = mode;
  }

  const svg = document.getElementById('previewSvg');
  const help = document.getElementById('helpText');
  
  if (interactionMode === 'view') {
    svg.className = "preview-svg mode-view";
    help.textContent = "💡 提示：平移與縮放背景視角，無法移動內嵌圖形";
  } else {
    svg.className = "preview-svg mode-edit";
    help.textContent = "🎯 提示：拖曳移動當前階段紅框，滾輪縮放圖片，拖曳紅色按鈕旋轉";
  }

  updateModeButtonsUI();
  renderPreview();
}

function renderLayersControl() {
  const container = document.getElementById('layersContainer');
  container.innerHTML = '';
  layers.forEach((layer, index) => {
    const card = document.createElement('div');
    card.className = `layer-card ${layer.stage === activeStage ? 'active' : ''}`;
    
    card.addEventListener('mousedown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
      
      activeStage = layer.stage; 
      if (!viewStates[activeStage]) {
        viewStates[activeStage] = { zoom: 1.0, focusX: layer.baseSize / 2, focusY: layer.baseSize / 2 };
      }
      
      // Stage 1 進入 View Mode，Stage 2+ 自動切至 Edit Mode
      if (activeStage > 1) {
        setMode('edit');
      } else {
        setMode('view');
      }

      renderLayersControl(); 
    });

    const isLast = (index === layers.length - 1 && index > 0);
    const displayPath = layer.path ? layer.path : "尚未上傳圖片...";

    card.innerHTML = `
      <div class="layer-title">
        <span>階段 ${layer.stage} ${index === 0 ? '(底圖 Stage 1)' : `(內嵌在 Stage ${index} 內)`}</span>
        ${isLast ? `<button class="btn-delete" onclick="removeLastLayer(event)">刪除此階段</button>` : ''}
      </div>
      
      <div class="form-group">
        <div class="upload-row">
          <input type="file" id="file-uploader-${index}" accept="image/*" style="display: none;" onchange="handleFileUpload(event, ${index})">
          <button class="btn-upload" onclick="document.getElementById('file-uploader-${index}').click()">📁 上傳圖片</button>
          <div class="path-display" title="${displayPath}">${displayPath}</div>
        </div>
      </div>

      <div class="form-group">
        <label>畫布基準尺寸 (baseSize)</label>
        <input type="number" value="${layer.baseSize}" oninput="updateData(${index}, 'baseSize', Number(this.value))">
      </div>
    `;
    container.appendChild(card);
  });
}

function handleFileUpload(event, index) {
  const file = event.target.files[0];
  if (!file) return;

  const tempPreviewUrl = URL.createObjectURL(file);
  layers[index].file = file;
  layers[index].path = `Material/${file.name}`;
  layers[index].previewSrc = tempPreviewUrl;

  activeStage = layers[index].stage;
  if (activeStage > 1) {
    setMode('edit');
  } else {
    setMode('view');
  }

  renderLayersControl();
  renderPreview();
}

function updateData(index, field, value) {
  layers[index][field] = value;
  if (field === 'baseSize' && layers[index].stage === activeStage) {
    viewStates[activeStage].focusX = value / 2;
    viewStates[activeStage].focusY = value / 2;
  }
  renderPreview();
}

function addLayer() {
  const newStage = layers.length + 1;
  if (layers.length > 0) {
    const prev = layers[layers.length - 1];
    prev.trigger = 10000; 
  }

  layers.push({ 
    stage: newStage, 
    path: "", 
    previewSrc: "", 
    baseSize: 1000, 
    x: 250, 
    y: 250, 
    scale: 0.3, 
    angle: 0,
    trigger: 10000,
    file: null
  });
  
  viewStates[newStage] = { zoom: 1.0, focusX: 500, focusY: 500 };
  
  activeStage = newStage;
  setMode('edit');

  renderLayersControl();
}

function removeLastLayer(event) {
  if (event) event.stopPropagation();
  if (layers.length <= 1) return;

  layers.pop();
  const lastIndex = layers.length - 1;
  layers[lastIndex].trigger = 10000;
  if (activeStage > layers.length) activeStage = layers.length;
  
  if (activeStage > 1) {
    setMode('edit');
  } else {
    setMode('view');
  }
  
  renderLayersControl();
}

/**
 * 遞迴構建預覽用 SVG 樹
 */
function buildRecursiveSVGElement(index) {
  const layer = layers[index];
  if (!layer) return null;

  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  const img = document.createElementNS("http://www.w3.org/2000/svg", "image");
  
  img.setAttributeNS("http://www.w3.org/1999/xlink", "href", layer.previewSrc || "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='%23eee'/><text x='10' y='50' fill='%23999' font-size='12'>未上傳圖片</text></svg>");
  img.setAttribute("width", layer.baseSize);
  img.setAttribute("height", layer.baseSize);
  
  if (layer.angle) {
    img.setAttribute("transform", `rotate(${layer.angle}, ${layer.baseSize / 2}, ${layer.baseSize / 2})`);
  }
  g.appendChild(img);

  const nextIndex = index + 1;
  const nextLayer = layers[nextIndex];

  if (nextLayer) {
    const subGroup = buildRecursiveSVGElement(nextIndex);
    if (subGroup) {
      subGroup.setAttribute("transform", `translate(${nextLayer.x}, ${nextLayer.y}) scale(${nextLayer.scale})`);
      g.appendChild(subGroup);
    }

    const isTargetToEdit = (nextLayer.stage === activeStage) && (interactionMode === 'edit');

    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("width", nextLayer.baseSize);
    rect.setAttribute("height", nextLayer.baseSize);
    rect.setAttribute("vector-effect", "non-scaling-stroke");

    if (isTargetToEdit) {
      rect.setAttribute("fill", "rgba(255, 59, 48, 0.08)");
      rect.setAttribute("stroke", "#ff3b30");
      rect.setAttribute("stroke-width", "2");
    } else {
      rect.setAttribute("fill", "none");
      rect.setAttribute("stroke", "transparent");
    }
    
    const rectGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
    const nextAngle = nextLayer.angle || 0;
    rectGroup.setAttribute("transform", `translate(${nextLayer.x}, ${nextLayer.y}) scale(${nextLayer.scale}) rotate(${nextAngle}, ${nextLayer.baseSize / 2}, ${nextLayer.baseSize / 2})`);
    rectGroup.appendChild(rect);
    g.appendChild(rectGroup);

    if (isTargetToEdit) {
      const parentLayer = layers.find(l => l.stage === activeStage - 1) || layers[0];
      const state = viewStates[parentLayer.stage] || { zoom: 1.0 };
      const info = getNextLayerWorldInfo(nextLayer, parentLayer.baseSize, state.zoom);
      
      const scaleFactor = 1.5;
      const bigRadius = info.visualRadius * scaleFactor;

      const handleGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
      handleGroup.setAttribute("id", "rotateHandle");
      handleGroup.setAttribute("transform", `translate(${info.handleX}, ${info.handleY})`);
      handleGroup.setAttribute("style", "cursor: grab;");

      const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute("cx", "0");
      circle.setAttribute("cy", "0");
      circle.setAttribute("r", bigRadius);
      circle.setAttribute("fill", "#eb2553");
      circle.setAttribute("stroke", "#ffffff");
      circle.setAttribute("stroke-width", bigRadius / 4);
      handleGroup.appendChild(circle);

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      const r = bigRadius * 0.5;
      path.setAttribute("d", `M 0 ${-r} A ${r} ${r} 0 1 1 ${-r} 0 L ${-r*1.3} 0 L ${-r*0.8} ${-r*0.5} L ${-r*0.3} 0 L ${-r*0.6} 0 A ${r*0.6} ${r*0.6} 0 1 0 0 ${-r*0.6} Z`);
      path.setAttribute("fill", "#ffffff");
      handleGroup.appendChild(path);

      g.appendChild(handleGroup);
    }
  }

  return g;
}

function renderPreview() {
  const svg = document.getElementById('previewSvg');
  svg.innerHTML = '';

  let renderRootIndex = 0;
  let viewStateKey = activeStage;

  if (activeStage > 1) {
    renderRootIndex = layers.findIndex(l => l.stage === activeStage - 1);
    viewStateKey = activeStage - 1;
  } else {
    renderRootIndex = layers.findIndex(l => l.stage === activeStage);
  }

  if (renderRootIndex === -1) renderRootIndex = 0;

  const rootLayer = layers[renderRootIndex];
  const state = viewStates[viewStateKey] || { zoom: 1.0, focusX: rootLayer.baseSize / 2, focusY: rootLayer.baseSize / 2 };
  
  const viewWidth = rootLayer.baseSize / state.zoom;
  const viewHeight = rootLayer.baseSize / state.zoom;
  const viewX = state.focusX - viewWidth / 2;
  const viewY = state.focusY - viewHeight / 2;
  svg.setAttribute("viewBox", `${viewX} ${viewY} ${viewWidth} ${viewHeight}`);

  const recursiveTree = buildRecursiveSVGElement(renderRootIndex);
  if (recursiveTree) svg.appendChild(recursiveTree);

  document.getElementById('infoOverlay').textContent = `檢視：Stage ${activeStage} (${interactionMode === 'edit' ? '🎯 編輯紅框' : '👁️ 移動視角'})`;
}

function setupCanvasEvents() {
  if (isEventsBound) return;
  isEventsBound = true;

  const canvas = document.getElementById('canvasContainer');
  
  function getEventContext() {
    let parentIndex = 0;
    let targetIndex = -1;

    if (activeStage > 1) {
      parentIndex = layers.findIndex(l => l.stage === activeStage - 1);
      targetIndex = layers.findIndex(l => l.stage === activeStage);
    } else {
      parentIndex = 0;
      targetIndex = -1;
    }

    if (parentIndex === -1) parentIndex = 0;
    const parentLayer = layers[parentIndex];
    const targetLayer = targetIndex !== -1 ? layers[targetIndex] : null;
    const stateKey = parentLayer.stage;
    
    if (!viewStates[stateKey]) {
      viewStates[stateKey] = { zoom: 1.0, focusX: parentLayer.baseSize / 2, focusY: parentLayer.baseSize / 2 };
    }

    return { parentLayer, targetLayer, state: viewStates[stateKey] };
  }

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const svg = document.getElementById('previewSvg');
    const rect = svg.getBoundingClientRect();
    const { parentLayer, targetLayer, state } = getEventContext();

    const size = parentLayer.baseSize / state.zoom;
    const viewX = state.focusX - size / 2;
    const viewY = state.focusY - size / 2;
    
    const mouseX = viewX + ((e.clientX - rect.left) / rect.width) * size;
    const mouseY = viewY + ((e.clientY - rect.top) / rect.height) * size;

    if (interactionMode === 'edit' && targetLayer) {
      const factor = e.deltaY < 0 ? 1.10 : 0.90; 
      
      const newScale = Math.min(Math.max(targetLayer.scale * factor, 0.00001), 100);
      const actualFactor = newScale / targetLayer.scale;
      
      const relX = mouseX - targetLayer.x;
      const relY = mouseY - targetLayer.y;
      targetLayer.x = mouseX - relX * actualFactor;
      targetLayer.y = mouseY - relY * actualFactor;
      targetLayer.scale = newScale;

      renderPreview();
    } else {
      const factor = e.deltaY < 0 ? 1.1 : 0.9;
      state.zoom = Math.max(0.1, state.zoom * factor);
      const newSize = parentLayer.baseSize / state.zoom;
      state.focusX = mouseX - ((e.clientX - rect.left) / rect.width) * newSize + newSize / 2;
      state.focusY = mouseY - ((e.clientY - rect.top) / rect.height) * newSize + newSize / 2;
      renderPreview();
    }
  },{passive:false});

  canvas.addEventListener('mousedown', (e) => {
    const svg = document.getElementById('previewSvg');
    const rect = svg.getBoundingClientRect();
    const { parentLayer, targetLayer, state } = getEventContext();

    const size = parentLayer.baseSize / state.zoom;
    const viewX = state.focusX - size / 2;
    const viewY = state.focusY - size / 2;
    
    const mouseX = viewX + ((e.clientX - rect.left) / rect.width) * size;
    const mouseY = viewY + ((e.clientY - rect.top) / rect.height) * size;

    if (interactionMode === 'edit' && targetLayer) {
      const rotResult = handleRotationStart(e, { x: mouseX, y: mouseY }, targetLayer, parentLayer.baseSize, state.zoom);
      if (rotResult.isRotating) {
        isRotating = true;
        startAngleOffset = rotResult.startAngleOffset;
        return;
      }
    }

    isDragging = true;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
  });

  window.addEventListener('mousemove', (e) => {
    const svg = document.getElementById('previewSvg');
    const rect = svg.getBoundingClientRect();
    const { parentLayer, targetLayer, state } = getEventContext();

    const size = parentLayer.baseSize / state.zoom;
    const viewX = state.focusX - size / 2;
    const viewY = state.focusY - size / 2;

    const mouseX = viewX + ((e.clientX - rect.left) / rect.width) * size;
    const mouseY = viewY + ((e.clientY - rect.top) / rect.height) * size;

    if (isRotating && interactionMode === 'edit' && targetLayer) {
      handleRotationMove({ x: mouseX, y: mouseY }, targetLayer, parentLayer.baseSize, state.zoom, startAngleOffset);
      renderPreview();
      return;
    }

    if (!isDragging) {
      if (interactionMode === 'edit' && targetLayer) {
        const info = getNextLayerWorldInfo(targetLayer, parentLayer.baseSize, state.zoom);
        const dist = Math.hypot(mouseX - info.handleX, mouseY - info.handleY);
        if (dist <= info.visualRadius * 2.5) {
          svg.style.cursor = 'grab';
        } else {
          svg.style.cursor = 'move';
        }
      }
      return;
    }

    const deltaX = ((e.clientX - lastMouseX) / rect.width) * (parentLayer.baseSize / state.zoom);
    const deltaY = ((e.clientY - lastMouseY) / rect.height) * (parentLayer.baseSize / state.zoom);

    if (interactionMode === 'edit' && targetLayer) {
      targetLayer.x += deltaX;
      targetLayer.y += deltaY;
    } else {
      state.focusX -= deltaX;
      state.focusY -= deltaY;
    }

    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    renderPreview();
  });

  window.addEventListener('mouseup', () => { 
    isDragging = false; 
    isRotating = false;
  });
}

function exportHTML() {
  if (layers.length < 1 || typeof EXPORT_TEMPLATE === 'undefined') return;

  let stageConfigString = layers.map((l, idx) => {
    const prev = layers[idx - 1];
    const next = layers[idx + 1];

    let nextCalcCode = '';
    if (next) {
      nextCalcCode = `(x, y, currentZoom) => {
        const tx = x - ${next.x};
        const ty = y - ${next.y};

        const sx = tx / ${next.scale};
        const sy = ty / ${next.scale};

        const nextZoom = currentZoom * ${next.scale} * (${next.baseSize} / ${l.baseSize});

        return {
          x: sx,
          y: sy,
          zoom: nextZoom
        };
      }`;
    } else {
      nextCalcCode = `(x, y, currentZoom) => ({ x, y, zoom: currentZoom })`;
    }

    if (idx === 0) {
      return `  {
      stage: 1, 
      baseSize: ${l.baseSize}, 
      minZoom: 1.0, 
      panelColor: "rgba(0, 0, 0, 0.85)", 
      panelPrefix: "", 
      transitionTrigger: ${l.trigger}, 
      lockThreshold: Infinity, 
      checkTargetValid: null,
      calculateNext: ${nextCalcCode}
    }`;
    } else {
      const entryZoom = prev.trigger * l.scale * (l.baseSize / prev.baseSize);

      return `  {
      stage: ${l.stage}, 
      baseSize: ${l.baseSize}, 
      minZoom: ${entryZoom}, 
      panelColor: "rgba(0, 32, 96, 0.85)", 
      panelPrefix: "階段${l.stage} ", 
      transitionTrigger: ${l.trigger}, 
      lockThreshold: Infinity, 
      checkTargetValid: null,
      calculateNext: ${nextCalcCode},
      calculatePrev: (x, y, currentZoom) => {
        const prevZoom = currentZoom / (${l.scale} * (${l.baseSize} / ${prev.baseSize}));

        return {
          x: ${l.x} + x * ${l.scale},
          y: ${l.y} + y * ${l.scale},
          zoom: prevZoom
        };
      }
    }`;
    }
  }).join(",\n");

  function buildExportSVGTree(index) {
    const l = layers[index];
    if (!l) return '';
    const next = layers[index + 1];
    let currentSrc = l.path || `Material/empty_stage${l.stage}.svg`;
    
    const imgAngle = l.angle || 0;
    let innerHTML = `<g><image href="${currentSrc}" width="${l.baseSize}" height="${l.baseSize}" transform="rotate(${imgAngle}, ${l.baseSize / 2}, ${l.baseSize / 2})"/></g>`;
    
    if (next) {
      const nextTree = buildExportSVGTree(index + 1);
      innerHTML += `\n      <g transform="translate(${next.x}, ${next.y}) scale(${next.scale})">${nextTree}</g>`;
    }

    return innerHTML;
  }

  let svgElementsString = layers.map((l, idx) => 
    `    <svg xmlns="http://www.w3.org/2000/svg" id="mysvg${l.stage}" viewBox="0 0 ${l.baseSize} ${l.baseSize}" style="display: ${idx === 0 ? 'block' : 'none'};">\n    ${buildExportSVGTree(idx)}\n  </svg>`
  ).join("\n");

  const finalHTML = EXPORT_TEMPLATE.replace('/* {{STAGE_CONFIG}} */', stageConfigString).replace('<!-- {{SVG_ELEMENTS}} -->', svgElementsString);

  const zip = new JSZip();
  zip.file("index.html", finalHTML);
  const materialFolder = zip.folder("Material");
  layers.forEach((layer) => { if (layer.file) materialFolder.file(layer.file.name, layer.file); });

  zip.generateAsync({ type: "blob" }).then(function (content) {
    saveAs(content, "PnP_Deep_Recursive_Export.zip");
  });
}

init();
</script>
<script src="comments.js"></script>
</body>
